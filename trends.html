<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>血圧と体重の推移</title>
<link rel="stylesheet" href="style.css?v=dayparts">
<script src="trends.js?v=dayparts" defer></script>
</head>
<body>
<main>
  <nav><a id="record-link" href="./">血圧記録表に戻る</a></nav>
  <section id="trends" aria-labelledby="trends-title">
    <h1 id="trends-title">血圧と体重の推移</h1>
    <label>記録月 <input id="month" type="month" required></label>
    <label>表示期間 <select id="trend-range">
      <option value="1">1か月</option>
      <option value="3" selected>3か月</option>
      <option value="6">6か月</option>
      <option value="12">12か月</option>
    </select></label>
    <label>血圧 <select id="trend-period">
      <option value="朝">朝</option>
      <option value="夜">夜</option>
      <option value="both">朝＋夜</option>
    </select></label>
    <p id="trend-dates"></p>
    <p id="trend-status" role="status"></p>
    <section class="trend-card" aria-label="血圧と体重の折れ線グラフ">
      <p class="trend-legend" id="trend-legend"></p>
      <div id="combined-chart"></div>
    </section>
  </section>
  <noscript>グラフを見るには JavaScript を有効にしてください。</noscript>
</main>
</body>
</html>
